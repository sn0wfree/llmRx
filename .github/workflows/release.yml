name: release

# Triggered by a semver tag. Produces, in one run:
#   - multi-platform binaries (linux amd64/arm64, darwin amd64/arm64, windows amd64)
#   - .tar.gz / .zip archives + checksums.txt + GitHub Release
#   - multi-arch container image pushed to ghcr.io
#   - packaged Helm chart attached to the release
#
# CGO note: internal/store uses mattn/go-sqlite3, so every target needs
# a C compiler. That is why this is a runner matrix rather than one
# pure-Go cross-compile. See docs/P16-DISTRIBUTION.md §5 D2.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- goreleaser
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Cross toolchains for the CGO builds. linux/amd64 uses the host
      # gcc; hardening is not needed here because the release binary is
      # the same one the Docker image ships.
      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------- docker
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # amd64 is built natively. arm64 needs the cross compiler plus
      # buildx/QEMU because the Dockerfile consumes a prebuilt binary.
      - name: Install arm64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build amd64 binary
        run: |
          mkdir -p build
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -extldflags '-static' \
              -X main.version=${{ steps.ver.outputs.version }} \
              -X main.commit=${{ github.sha }} \
              -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o build/llmRx ./cmd/gateway

      - name: Upload amd64 binary for the arm64 stage
        uses: actions/upload-artifact@v4
        with:
          name: llmrx-amd64
          path: build/llmRx

      - name: Build arm64 binary
        run: |
          mkdir -p build-arm64
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -ldflags="-s -w -extldflags '-static' \
              -X main.version=${{ steps.ver.outputs.version }} \
              -X main.commit=${{ github.sha }} \
              -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o build-arm64/llmRx ./cmd/gateway

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-

      # Two image builds with the same tag, then merged into one
      # manifest list. Building per-arch keeps each stage on the native
      # toolchain instead of emulating CGO through QEMU.
      - name: Build and push amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # --------------------------------------------------------------------- helm
  helm:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    steps:
      - uses: actions/checkout@v4

      - name: Set chart version
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: $V/" deploy/helm/llmrx/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$V\"/" deploy/helm/llmrx/Chart.yaml

      - uses: azure/setup-helm@v4

      - name: Package chart
        run: helm package deploy/helm/llmrx -d dist

      - name: Attach chart to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
