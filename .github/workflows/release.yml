name: release

# Triggered by a semver tag. Produces, in one run:
#   - multi-platform binaries (linux amd64/arm64, darwin amd64/arm64, windows amd64)
#   - .tar.gz / .zip archives + checksums.txt + GitHub Release
#   - multi-arch container image pushed to ghcr.io
#   - packaged Helm chart attached to the release
#
# Why this is split per OS
# ------------------------
# internal/store uses mattn/go-sqlite3, so every server build needs CGO.
# CGO cannot cross-compile a darwin or Windows binary from Linux (it
# needs that platform's C toolchain and headers), so a single ubuntu job
# running `goreleaser release` fails on the first such target. Each OS
# therefore builds on its own runner with `goreleaser build --id ...`,
# which is the only command that accepts `--id`.
#
# Those jobs only produce binaries. A single `package-and-release` job
# collects them, builds the archives, writes checksums and publishes one
# Release — so several jobs can never race to create it.
#
# A final `checksums` job re-hashes the complete asset set once the Helm
# chart is attached, because package-and-release cannot see files that a
# later job uploads.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------- build: linux
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # arm64 needs the aarch64 cross toolchain; amd64 uses the host gcc.
      - name: Install arm64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build linux binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --clean --id linux-amd64 --id linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: dist/
          if-no-files-found: error

  # The client is pure Go (CGO_ENABLED=0), so one job produces every
  # platform's client binary.
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build client binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --clean --id client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: bin-client
          path: dist/
          if-no-files-found: error

  # ------------------------------------------------------------ build: darwin
  build-darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build darwin binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --clean --id darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: bin-darwin
          path: dist/
          if-no-files-found: error

  # ----------------------------------------------------------- build: windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # CGO on Windows needs a C compiler on PATH; fail fast with a clear
      # message instead of a confusing linker error.
      - name: Verify a C toolchain is present
        shell: bash
        run: gcc --version

      - name: Build windows binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --clean --id windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: dist/
          if-no-files-found: error

  # ------------------------------------------------- package + publish release
  #
  # Archives are produced here rather than by goreleaser's `release`
  # command, because that command cannot be scoped to a build id. Names
  # and contents follow goreleaser's conventions so the result is what
  # users expect from any other Go project.
  package-and-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-client, build-darwin, build-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: bins

      - name: Show what was collected
        run: find bins -type f \( -name llmrx -o -name llmrx.exe \) -printf '%p  %s bytes\n' | sort

      - name: Create archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out

          # emit <os> <arch> <binary-path>: one line per built binary.
          # goreleaser's dist layout is
          #   dist/<id>_<os>_<arch>[_<variant>]/<binary>
          emit() {
            local bin="$1"
            local dir; dir=$(basename "$(dirname "$bin")")
            local os arch
            case "$dir" in
              *linux_amd64*)   os=linux;   arch=amd64 ;;
              *linux_arm64*)   os=linux;   arch=arm64 ;;
              *darwin_amd64*)  os=darwin;  arch=amd64 ;;
              *darwin_arm64*)  os=darwin;  arch=arm64 ;;
              *windows_amd64*) os=windows; arch=amd64 ;;
              *) echo "  skip (unrecognised): $bin" >&2; return 0 ;;
            esac
            echo "$os $arch $bin"
          }

          # Parenthesised so -o does not swallow the following predicate.
          server_bins=$(find bins -type f \( -name llmrx -o -name llmrx.exe \) | sort)
          client_bins=$(find bins -type f \( -name gateway-client -o -name gateway-client.exe \) | sort)

          pack() {
            local name="$1" os="$2" arch="$3" bin="$4"
            local stage; stage=$(mktemp -d)
            # mktemp -d is 700 and actions/download-artifact does not
            # preserve unix modes, so both the directory and every
            # executable are normalised here instead of trusting dist/.
            chmod 755 "$stage"
            cp "$bin" "$stage/"
            chmod 755 "$stage/$(basename "$bin")"
            if [ "$name" = "llmrx" ]; then
              # Ship the sample config and the systemd unit with the
              # server, mirroring what an operator needs to start it.
              cp config.yml "$stage/" 2>/dev/null || true
              mkdir -p "$stage/systemd"
              chmod 755 "$stage/systemd"
              cp deploy/systemd/llmrx.service "$stage/systemd/" 2>/dev/null || true
            fi
            cp README.md CHANGELOG.md "$stage/" 2>/dev/null || true
            for f in LICENSE*; do [ -e "$f" ] && cp "$f" "$stage/"; done

            local base="${name}_${VERSION}_${os}_${arch}"
            # Absolute output dir captured BEFORE the subshell cd: using
            # $PWD inside the subshell would point at $stage.
            local outdir="$PWD/out"
            if [ "$os" = "windows" ]; then
              # python3 rather than `zip`: the runner image does not
              # guarantee zip, and this keeps the step dependency-free.
              python3 - "$stage" "$outdir/${base}.zip" <<'PY'
          import os, sys, zipfile
          src, dst = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk(src):
                  for name in files:
                      path = os.path.join(root, name)
                      z.write(path, os.path.relpath(path, src))
          PY
            else
              ( cd "$stage" && tar -czf "$outdir/${base}.tar.gz" . )
            fi
            rm -rf "$stage"
          }

          while read -r os arch bin; do
            [ -n "${bin:-}" ] || continue
            pack llmrx "$os" "$arch" "$bin"
          done < <(for b in $server_bins; do emit "$b"; done)

          while read -r os arch bin; do
            [ -n "${bin:-}" ] || continue
            pack gateway-client "$os" "$arch" "$bin"
          done < <(for b in $client_bins; do emit "$b"; done)

          # Provisional: covers the archives only. The checksums job
          # replaces this file once the Helm chart has been attached.
          ( cd out && sha256sum * > checksums.txt )
          echo "--- produced ---"
          ls -lh out

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: llmRx ${{ github.ref_name }}
          files: |
            out/*.tar.gz
            out/*.zip
            out/checksums.txt
          body: |
            ## llmRx ${{ github.ref_name }}

            LLM API gateway: OpenAI-compatible entry point with smart routing,
            multi-tenant billing and observability.

            ### Install

            ```bash
            # Docker (recommended)
            docker run -d -p 8787:8787 -v llmrx-data:/data \
              -e LLMRX_KEY_MASTER=$(openssl rand -hex 32) \
              ghcr.io/sn0wfree/llmrx:${{ github.ref_name }}
            ```

            Or download the archive for your platform below, then:

            ```bash
            ./llmrx -version        # confirm the build
            ./llmrx -config config.yml
            ```

            The edge client (`gateway-client_*`) is a separate download: it is a
            pure-Go proxy you run beside your agents. See docs/P15-CLIENT.md.

  # ------------------------------------------------------------------- docker
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install arm64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binaries for both architectures
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "build/$arch"
            cc=gcc
            if [ "$arch" = arm64 ]; then cc=aarch64-linux-gnu-gcc; fi
            CGO_ENABLED=1 GOOS=linux GOARCH="$arch" CC="$cc" \
              go build -ldflags="-s -w -extldflags '-static' \
                -X main.version=${{ steps.ver.outputs.version }} \
                -X main.commit=${{ github.sha }} \
                -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "build/$arch/llmRx" ./cmd/gateway
          done
          ls -lR build
          file build/amd64/llmRx build/arm64/llmRx

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-

      # Build one image per architecture, then merge the manifests. BIN_PATH
      # points the shared Dockerfile at the matching prebuilt binary, so no
      # staging step and no Go under emulation is involved.
      # GHCR rejects uppercase repository names, and github.repository is
      # "sn0wfree/llmRx". metadata-action lowercases for the tags below, but
      # a hand-written image reference does not -- that is what made the
      # v0.1.1 attempts fail at the first build-push step.
      - name: Normalise the image reference
        id: img
        run: echo "ref=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BIN_PATH=build/amd64/llmRx
          tags: ${{ steps.img.outputs.ref }}:build-amd64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            BIN_PATH=build/arm64/llmRx
          tags: ${{ steps.img.outputs.ref }}:build-arm64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Merge into a multi-arch manifest
        run: |
          set -euo pipefail
          IMG="${{ steps.img.outputs.ref }}"
          tags=()
          while IFS= read -r t; do
            [ -n "$t" ] && tags+=("--tag" "$t")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${tags[@]}" \
            "$IMG:build-amd64" "$IMG:build-arm64"
          docker buildx imagetools inspect "${{ steps.meta.outputs.tags }}"

  # --------------------------------------------------------------------- helm
  helm:
    runs-on: ubuntu-latest
    needs: [package-and-release]
    steps:
      - uses: actions/checkout@v4

      - name: Set chart version
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: $V/" deploy/helm/llmrx/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$V\"/" deploy/helm/llmrx/Chart.yaml

      - uses: azure/setup-helm@v4

      - name: Package chart
        run: helm package deploy/helm/llmrx -d out

      - name: Attach chart to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" out/*.tgz \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------- checksums
  #
  # package-and-release can only hash what it produced itself, and the Helm
  # chart is uploaded later by the helm job. Running sha256sum after both
  # have finished is the only way to cover every asset in one file.
  checksums:
    runs-on: ubuntu-latest
    needs: [package-and-release, helm]
    steps:
      # gh needs a repository to resolve against; without a checkout it has
      # no remote to infer one from, and the v0.1.1 run failed here.
      - uses: actions/checkout@v4

      - name: Download every release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir assets --clobber
          ls -lh assets

      - name: Recompute checksums over the whole asset set
        run: |
          # The download brings the old checksums.txt with it; hashing it
          # would fold the previous manifest into the new one.
          rm -f assets/checksums.txt
          ( cd assets && sha256sum * > checksums.txt )
          cat assets/checksums.txt

      - name: Replace checksums.txt on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" assets/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
