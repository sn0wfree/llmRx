# goreleaser configuration for llmRx.
#
# Release flow:
#   1. scripts/release-check.sh vX.Y.Z
#   2. rename CHANGELOG [Unreleased] → [vX.Y.Z] and commit
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#   4. .github/workflows/release.yml runs goreleaser
#
# CGO constraint: internal/store imports mattn/go-sqlite3, so every
# target needs a C toolchain. That is why each platform/arch pair is
# listed explicitly with its own CC rather than using a pure-Go
# cross-compile. See docs/P16-DISTRIBUTION.md §5 D2.
version: 2

project_name: llmrx

before:
  hooks:
    - go mod tidy

builds:
  # --- Linux amd64: static, matches the Docker image ---
  - id: linux-amd64
    main: ./cmd/gateway
    binary: llmrx
    goos: [linux]
    goarch: [amd64]
    env: [CGO_ENABLED=1]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -extldflags '-static'
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags: []

  # --- Linux arm64: statically linked against aarch64 gcc ---
  - id: linux-arm64
    main: ./cmd/gateway
    binary: llmrx
    goos: [linux]
    goarch: [arm64]
    env: [CGO_ENABLED=1, CC=aarch64-linux-gnu-gcc]
    flags: [-trimpath]
    ldflags: *ldflags

  # --- macOS: built on a macOS runner, dynamically linked ---
  - id: darwin
    main: ./cmd/gateway
    binary: llmrx
    goos: [darwin]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=1]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # --- Windows: needs a MinGW toolchain on a windows runner ---
  #
  # Both darwin and windows build only on their own OS: CGO cannot
  # cross-compile them from Linux. release.yml enforces that with
  # per-job `--id` flags rather than a `skip` template — goreleaser's
  # skip templates cannot see the runner's OS.
  - id: windows
    main: ./cmd/gateway
    binary: llmrx
    goos: [windows]
    goarch: [amd64]
    env: [CGO_ENABLED=1]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # --- Edge client (P15): pure Go, every platform, no toolchain ---
  - id: client
    main: ./cmd/gateway-client
    binary: gateway-client
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: server
    builds: [linux-amd64, linux-arm64, darwin, windows]
    # `format` (singular) rather than `formats`: the plural form only
    # exists from goreleaser v2.6, and this config must also validate
    # against the v2.5.x line that CI pins.
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      llmrx_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - README.md
      - CHANGELOG.md
      - config.yml
      - deploy/systemd/*

  # The client ships separately: it goes on laptops and edge boxes, so
  # its archive carries only the binary and a config sample.
  - id: client
    builds: [client]
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      gateway-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?:'
      order: 2
    - title: Documentation
      regexp: '^docs(\(.+\))?:'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^Merge '

release:
  github:
    owner: sn0wfree
    name: llmRx
  draft: false
  prerelease: auto
  header: |
    ## llmRx {{ .Version }}

    LLM API gateway: OpenAI-compatible entry point with smart routing,
    multi-tenant billing and observability.

    ### Install

    ```bash
    # Docker (recommended)
    docker run -d -p 8787:8787 -v llmrx-data:/data \
      -e LLMRX_KEY_MASTER=$(openssl rand -hex 32) \
      ghcr.io/sn0wfree/llmrx:{{ .Version }}
    ```

    Or download the archive for your platform below, then:

    ```bash
    ./llmrx -version        # confirm the build
    ./llmrx -config config.yml
    ```
  footer: |
    **Full changelog**: see
    [CHANGELOG.md](https://github.com/sn0wfree/llmRx/blob/master/CHANGELOG.md).
