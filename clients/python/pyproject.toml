[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrx-client"
version = "0.1.0"
description = "llmRx edge client: a local OpenAI-compatible proxy with response cache, offline fallback and usage accounting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "llmRx" }]
keywords = ["llm", "proxy", "gateway", "openai", "edge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Proxies",
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
gateway-client = "llmrx_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
