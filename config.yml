server:
  # host: 0.0.0.0  # 可选，默认 0.0.0.0（所有接口）
  port: 8787
  log_level: info
  # 请求日志后端: jsonl(默认，append-only + 按天/按大小 rotate) |
  # sqlite(旧行为，每天一个 .db) | postgres(集群模式共享表)。
  # jsonl 写入比 sqlite 快约 3.8x，且日志文件可直接用 jq/grep 消费。
  # logstore_backend: jsonl
  # JSONL 模式下每批写完后是否 fsync。false(默认) 与 SQLite 的
  # synchronous=NORMAL 语义一致：崩溃最多丢最近一批。
  # logstore_fsync: false
  # Fresh installs seed a default admin/admin account. Change the
  # password immediately via /admin/users or set admin_password to
  # disable the default. Keep this true only in trusted networks.
  allow_default_admin_password: true
  # Prometheus /metrics 独立监听地址。空 = 关闭（默认）。
  # 只绑内网/回环（如 127.0.0.1:9090），不要暴露公网。
  # metrics_addr: "127.0.0.1:9090"
  # 反代部署（nginx 等）时置 true，让限速/日志/蜜罐拿到真实客户端 IP；
  # trusted_proxy_cidrs 限定只信任哪些代理来源（防 X-Forwarded-For 伪造）。
  # trust_proxy_headers: false
  # trusted_proxy_cidrs: ["127.0.0.1/32"]

database:
  driver: sqlite
  dsn: data/llmrx.db

# BYOK (Bring Your Own Key) is reserved for future use. Must
# remain false until the Phase 1.5 feature ships.
byok:
  enabled: false

# Secrets: at-rest encryption of channel API keys (AES-256-GCM).
# In production, set LLMRX_KEY_MASTER in the environment (32-byte
# hex, generate with `openssl rand -hex 32`). For local dev only,
# dev_allow_plaintext_keys: true lets the gateway start without a
# master key — channel keys are stored in plaintext. NEVER enable
# this on any non-localhost deployment.
secrets:
  key_master_env: LLMRX_KEY_MASTER
  dev_allow_plaintext_keys: false

# latency_routing: 可选延迟感知路由（默认关闭）。开启后每个 channel
# 维护 EWMA 响应延迟，路由时把慢 channel 排后。
#   strategy: latency（纯延迟）或 cost_latency_blend（价格+延迟混合，默认）
#   cost_weight/latency_weight: 混合策略权重（默认 0.7 / 0.3）
latency_routing:
  enabled: false
  alpha: 0.1
  strategy: cost_latency_blend
  cost_weight: 0.7
  latency_weight: 0.3

# balance_monitor: 上游账户余额定期查询（P14）。
# 支持的 provider 见 providers.yaml 里的 balance 段（DeepSeek / Moonshot /
# 智谱 / SiliconFlow / one-api 系中转）。没有余额接口的 provider 在管理台
# 显示 “—”，不影响任何请求路径。
#   关闭后台刷新后，管理台的“刷新”按钮仍然可用。
balance_monitor:
  enabled: true
  interval_sec: 3600   # 刷新周期；0 = 关闭自动刷新
  timeout_sec: 10      # 单次查询超时
  # 余额历史保留天数（默认 90）。刻意与 log_retention_days 分开：
  # 日志保留是运维偏好，余额历史是财务数据，两者的自然窗口不同。
  retention_days: 90

# edge_clients: 允许上传用量的 gateway-client 边缘实例（P15）。
# token 用 `openssl rand -hex 24` 生成。列表为空时 /client/v1/* 完全不挂载。
# 客户端侧的用量记录按名称出现在日志里（RouterPath = client:<name>），
# 其中 source=local 的行是服务端从未见过的兜底直连消耗，是唯一计费依据。
# edge_clients:
#   - name: laptop-alice
#     token: 5f8a...c2
#   - name: edge-bj-01
#     token: 9c1d...7e

# session_affinity: 可选会话亲和（默认关闭）。开启后 mode:auto 的
# 多轮对话会钉在同一 model/channel（保上游 prompt cache 与一致性）。
# session 来源优先级：X-Session-ID 请求头 > body user 字段 > system+首条 user 哈希。
session_affinity:
  enabled: false
  ttl_sec: 3600
  max_entries: 10000

tokens:
  - key: sk-test-token-123
    name: test-token
    models: [deepseek-chat, deepseek-reasoner]

channels:
  - name: deepseek-main
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    keys:
      - ${DEEPSEEK_API_KEY}
    models:
      - deepseek-chat
      - deepseek-reasoner
    priority: 10
    input_price_per_1m: 0.14
    output_price_per_1m: 0.42
    max_failures: 5
    reset_timeout_ms: 60000
    # P21 上游套餐配额（可选）。配置后 /admin/monitoring 展示配额进度，
    # 耗尽的渠道被路由自动避开（L2.5 quota guard）；切到 cost_strategy:
    # quota_aware 还可按剩余配额智能分配。
    #   plan_kind: code | token | ""（展示徽章）
    #   plan_quota_metric: tokens（prompt+completion）| prompt_tokens | usd
    #   plan_quota_window: monthly（自然月）| daily | rolling（滚动 N 小时）
    #   plan_quota_window_hours: 仅 rolling 需要，如编程套餐的 5
    # 全部留空 = 不跟踪。
    plan_kind: ""
    plan_quota_metric: ""
    plan_quota_limit: 0
    plan_quota_window: ""
    plan_quota_window_hours: 0

  # 订阅制渠道示例：GLM Coding Plan 类套餐，5h 滚动窗口 12 万 prompt tokens
  # - name: glm-coding
  #   provider: zhipu
  #   base_url: https://open.bigmodel.cn/api/paas/v4
  #   keys:
  #     - ${ZHIPU_API_KEY}
  #   models:
  #     - glm-4.7
  #   plan_kind: code
  #   plan_quota_metric: prompt_tokens
  #   plan_quota_limit: 120000
  #   plan_quota_window: rolling
  #   plan_quota_window_hours: 5
  #
  # 注：上面的 plan_quota_* 是 P21 的「本地估算」。要拿厂商侧真实用量，在渠道编辑页
  # 配置「源头用量探针」（P22），见文件末尾 usage_monitor 段。

  - name: minimax-main
    provider: minimax
    base_url: https://api.minimax.io/v1
    keys:
      - ${MINIMAX_API_KEY}
    models:
      - MiniMax-Text-01
    priority: 5
    input_price_per_1m: 0.10
    output_price_per_1m: 0.30
    max_failures: 5
    reset_timeout_ms: 60000

# P22 厂商侧订阅用量探测。探针按渠道配置（渠道编辑页「源头用量探针」区，或
# PUT /admin/api/v1/channels/{id} 的 usage_probe 字段）；这里只控制轮询节奏。
# usage_probe.kind 可用值：
#   openrouter_key  官方 GET /api/v1/key（推荐；多窗口：key 限额 / 日 / 周 / 月）
#   zhipu_web       GLM Coding Plan 仪表盘 Cookie 抓取（实验性，需填 Cookie 与接口地址）
#   custom          通用 JSONPath（endpoint_url + json_path + window_name + unit）
usage_monitor:
  enabled: true
  interval_sec: 3600      # 厂商仪表盘更新慢，不建议低于 300
  timeout_sec: 15
  retention_days: 90
