apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llmrx.fullname" . }}-config
  labels:
    {{- include "llmrx.labels" . | nindent 4 }}
data:
  config.yml: |
    server:
      port: {{ .Values.config.server.port }}
      log_level: {{ .Values.config.server.log_level | quote }}
      trust_proxy_headers: {{ .Values.config.server.trust_proxy_headers }}
      {{- if .Values.config.server.trusted_proxy_cidrs }}
      trusted_proxy_cidrs:
        {{- toYaml .Values.config.server.trusted_proxy_cidrs | nindent 8 }}
      {{- end }}
      allow_default_admin_password: {{ .Values.config.server.allow_default_admin_password }}
      {{- if .Values.config.server.cors_allowed_origins }}
      cors_allowed_origins:
        {{- toYaml .Values.config.server.cors_allowed_origins | nindent 8 }}
      {{- end }}
      markup_ratio: {{ .Values.config.server.markup_ratio }}
      breaker_max_failures: {{ .Values.config.server.breaker_max_failures }}
      breaker_reset_timeout_ms: {{ .Values.config.server.breaker_reset_timeout_ms }}
      log_retention_days: {{ .Values.config.server.log_retention_days }}
      stream_timeout_sec: {{ .Values.config.server.stream_timeout_sec }}
      stream_max_body_bytes: {{ .Values.config.server.stream_max_body_bytes }}
      request_timeout_sec: {{ .Values.config.server.request_timeout_sec }}
      max_retries: {{ .Values.config.server.max_retries }}
      retry_base_delay_ms: {{ .Values.config.server.retry_base_delay_ms }}
      {{- if .Values.cluster.enabled }}
      logstore_backend: postgres
      cache_backend: sqlite
      {{- end }}
    database:
      driver: {{ if .Values.cluster.enabled }}postgres{{ else }}sqlite{{ end }}
      dsn: {{ if .Values.cluster.enabled }}{{ .Values.cluster.postgresDsn | quote }}{{ else }}/data/llmrx.db{{ end }}
    strategy:
      cost_strategy: {{ .Values.config.strategy.cost_strategy | quote }}
    secrets:
      dev_allow_plaintext_keys: {{ .Values.config.secrets.dev_allow_plaintext_keys }}
