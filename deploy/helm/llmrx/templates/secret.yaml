{{- if or .Values.secrets.masterKey .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llmrx.fullname" . }}-secret
  labels:
    {{- include "llmrx.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.masterKey }}
  LLMRX_KEY_MASTER: {{ .Values.secrets.masterKey | b64enc }}
  {{- end }}
  {{- range $key, $val := .Values.providerKeys }}
  {{- if $val }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
