# llmRx 公网加固反向代理 + 蜜罐
#
# 拓扑：
#   公网 → :80/:443 nginx
#     ├─ 真实服务路径（/v1 /api/v1 /admin /account /health）→ 127.0.0.1:8787
#     │    └─ /admin/api/v1/login 单独限速 5r/m（撞库防护）
#     ├─ /nodes/* → 直接 403（集群内部端点，永不对公网）
#     ├─ 扫描器必踩路径（wp-login/.env/phpmyadmin/...）→ 蜜罐：记录 + 假响应
#     └─ 其余一切 → 假 404（记录），真实服务对未列路径不可见
#
# 配套 fail2ban 见同目录 fail2ban/。部署步骤见 README.md。
#
# 这是一份【完整独立】的 nginx.conf（events + http 自包含），
# 整体替换 /etc/nginx/nginx.conf 使用——限速区和 log_format 必须
# 位于 http 块内，站点片段（sites-available）放不了这些指令。

events {
    worker_connections 1024;
}

http {
include /etc/nginx/mime.types;
default_type application/octet-stream;
access_log /var/log/nginx/access.log;
sendfile on;

# ---------- 限速区 ----------
# 管理登录：每 IP 每分钟 5 次（撞库/爆破）。应用层登录本身无限速，
# 这里是第一道闸；fail2ban 对 429 再封。
limit_req_zone $binary_remote_addr zone=llmrx_login:10m rate=5r/m;
# 全局 API 突发：正常客户端 30r/s 足够，扫描器直接被压。
limit_req_zone $binary_remote_addr zone=llmrx_api:10m rate=30r/s;
# 注册/兑换：应用层已有 per-IP 限速，这里兜底。
limit_req_zone $binary_remote_addr zone=llmrx_selfsvc:10m rate=10r/m;
# 每 IP 并发连接（slowloris / 并发拖垮）。
limit_conn_zone $binary_remote_addr zone=llmrx_conn:10m;

# 蜜罐专用日志（fail2ban 读这个文件做封禁）。
log_format llmrx_honeypot '$remote_addr - $time_iso8601 '
                         '"$request" $status '
                         '"$http_user_agent" "$http_referer"';

# 登录端点访问日志（fail2ban 对 429 封禁用）。
log_format llmrx_login '$remote_addr - $time_iso8601 '
                       '"$request" $status "$http_user_agent"';

# ---------- HTTP → HTTPS + ACME ----------
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    # certbot --webroot 用这个目录验证域名（不会被 301 挡住）
    location /.well-known/acme-challenge/ {
        root /var/www/llmrx;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 主站 ----------
server {
    # http2 写在 listen 上：兼容 apt 版 nginx 1.18（Ubuntu 22.04）
    # 到新版（1.25+ 仅提示 deprecated，仍可用）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your.domain.example;   # ← 改成真实域名
    server_tokens off;                 # 不暴露 nginx 版本

    # 证书路径放在独立 include 里：引导期先写入自签证书让 nginx 起来，
    # certbot 签发后把 include 换成真实路径即可（见 REMOTE-DEPLOY.md §5）。
    include /etc/nginx/llmrx-certs.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 全局护栏 ----
    limit_conn llmrx_conn 20;           # 每 IP 最多 20 并发
    client_max_body_size 32m;           # 应用默认 64M，这里收紧
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;

    # =========================================================
    # 蜜罐：扫描器高频路径。全部记录到 llmrx-honeypot.log，
    # 返回像模像样的假响应，消耗对方时间且不暴露真实服务。
    # =========================================================

    # WordPress 系（最高频探测）
    location = /wp-login.php {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        default_type text/html;
        return 200 '<html><head><title>Log In &#8212; WordPress</title></head><body class="login"><div id="login"><h1><a href="https://wordpress.org/">Powered by WordPress</a></h1><form name="loginform" id="loginform" action="/wp-login.php" method="post"><p><label>Username or Email Address</label><input type="text" name="log" id="user_login"></p><p><label>Password</label><input type="password" name="pwd" id="user_pass"></p><p class="submit"><input type="submit" name="wp-submit" value="Log In"></p></form></div></body></html>';
    }
    location = /xmlrpc.php {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        default_type text/xml;
        return 200 '<?xml version="1.0"?><methodResponse><fault><faultCode>-32601</faultCode><faultString>Server does not support the requested method</faultString></fault></methodResponse>';
    }
    location ^~ /wp-admin/ {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        return 302 /wp-login.php;
    }

    # 敏感文件/目录（.env、.git、备份、phpmyadmin、actuator…）
    location ~* ^/(\.env|\.git|\.svn|\.htpasswd|phpmyadmin|pma|adminer|actuator|server-status|server-info|\.aws|\.ssh|id_rsa|backup|dump|db|wp-config\.php|config\.php|phpinfo|info\.php|vendor/|node_modules/) {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        # 假 404 + 伪装成通用 Apache（扫描器看到的和真实栈无关）
        default_type text/html;
        return 404 '<html><head><title>404 Not Found</title></head><body><center><h1>404 Not Found</h1></center><hr><center>Apache</center></body></html>';
    }

    # =========================================================
    # 真实服务：只放行已知路径，其余一律不代理。
    # =========================================================

    # 管理登录：单独限速 5r/m + 独立日志（fail2ban 封 429）
    location = /admin/api/v1/login {
        access_log /var/log/nginx/llmrx-login.log llmrx_login;
        limit_req zone=llmrx_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # 让应用知道走了 TLS
        proxy_read_timeout 30s;
    }

    # 管理控制台 + API（HTML + JSON + SSE 实时日志）
    # 生产建议：整段换成 IP 白名单（VPN/办公网），公网只留 /v1。
    #   allow 10.8.0.0/24;   # 你的 VPN 网段
    #   deny all;
    location ^~ /admin/ {
        limit_req zone=llmrx_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";          # SSE 长连接需要
        proxy_buffering off;                     # SSE 实时日志不缓冲
        proxy_read_timeout 300s;                 # 长流不被掐
    }

    # LLM API（核心业务路径）
    location ^~ /v1/ {
        limit_req zone=llmrx_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;                     # 流式 SSE 响应必须关缓冲
        proxy_read_timeout 300s;                 # 长补全不超时
        proxy_send_timeout 300s;
    }

    # 自服务：注册（需邀请码）/ me / 兑换
    location ^~ /api/v1/ {
        limit_req zone=llmrx_selfsvc burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # 用户自助页
    location ^~ /account/ {
        limit_req zone=llmrx_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # 健康检查（监控/负载均衡用；也可只允许内网）
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 5s;
    }

    # 集群内部端点：公网直接 403（应用层还有内网中间件双保险）
    location ^~ /nodes/ {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        return 403;
    }

    # =========================================================
    # 兜底：任何未列出的路径 → 记录 + 假 404。
    # 真实服务对公网"看不见"未声明的路由。
    # =========================================================
    location / {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        default_type text/html;
        return 404 '<html><head><title>404 Not Found</title></head><body><center><h1>404 Not Found</h1></center><hr><center>Apache</center></body></html>';
    }
}

}   # end http

