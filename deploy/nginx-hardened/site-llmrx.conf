# llmRx 加固站点（多站点共存服务器的适配版）
#
# 替换 /etc/nginx/sites-available/llmrx。原文件一个文件装了三块：
#   ① 80 default_server（ACME + 301）  ② llmrx 443  ③ frp 443
# 本文件：①③ 原样保留（逐字节不变），② 换成加固版。
# 限速区/日志格式在 conf.d-llmrx-hardening.conf（http 上下文），
# 必须先安装那个文件，否则 limit_req_zone 未定义会 nginx -t 失败。
#
# 相对全量 nginx.conf 的差异（有意为之）：
# - 证书路径内联（复用现有通配符证书，无需 llmrx-certs.conf include）
# - client_max_body_size 保留原有的 20m（不放宽既有口径）
# - proxy_read_timeout 保留原有的 600s
# - 80 块的 ACME root 保留 /var/www/acme（certbot 现有 webroot）

# ===== 80 端口: ACME 挑战 + 跳转 HTTPS（与原文件一致）=====
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== llmrx.tokenhub.top: 加固版 =====
server {
    listen 443 ssl http2;
    server_name llmrx.tokenhub.top;
    ssl_certificate     /etc/letsencrypt/live/tokenhub.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokenhub.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;                       # 不暴露 nginx 版本

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 全局护栏（每 IP 并发 + body 上限，body 沿用原 20m）
    limit_conn llmrx_conn 20;
    client_max_body_size 20m;

    # =========================================================
    # 蜜罐：扫描器高频路径。记录到 llmrx-honeypot.log（fail2ban
    # 首次命中即封），返回像模像样的假响应，不暴露真实服务。
    # =========================================================
    location = /wp-login.php {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        default_type text/html;
        return 200 '<html><head><title>Log In &#8212; WordPress</title></head><body class="login"><div id="login"><h1><a href="https://wordpress.org/">Powered by WordPress</a></h1><form name="loginform" id="loginform" action="/wp-login.php" method="post"><p><label>Username or Email Address</label><input type="text" name="log" id="user_login"></p><p><label>Password</label><input type="password" name="pwd" id="user_pass"></p><p class="submit"><input type="submit" name="wp-submit" value="Log In"></p></form></div></body></html>';
    }
    location = /xmlrpc.php {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        default_type text/xml;
        return 200 '<?xml version="1.0"?><methodResponse><fault><faultCode>-32601</faultCode><faultString>Server does not support the requested method</faultString></fault></methodResponse>';
    }
    location ^~ /wp-admin/ {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        return 302 /wp-login.php;
    }
    location ~* ^/(\.env|\.git|\.svn|\.htpasswd|phpmyadmin|pma|adminer|actuator|server-status|server-info|\.aws|\.ssh|id_rsa|backup|dump|db|wp-config\.php|config\.php|phpinfo|info\.php|vendor/|node_modules/) {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        default_type text/html;
        return 404 '<html><head><title>404 Not Found</title></head><body><center><h1>404 Not Found</h1></center><hr><center>Apache</center></body></html>';
    }

    # =========================================================
    # 真实服务：只放行已知路径（/v1 /api/v1 /admin /account /health）
    # =========================================================

    # 管理登录：5r/m 限速 + 独立日志（fail2ban 封 429）
    location = /admin/api/v1/login {
        access_log /var/log/nginx/llmrx-login.log llmrx_login;
        limit_req zone=llmrx_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 管理控制台 + API（HTML + JSON + SSE 实时日志）
    # 生产建议：整段换成 IP 白名单（VPN），公网只留 /v1。
    #   allow 10.8.0.0/24;   # 你的 VPN 网段
    #   deny all;
    location ^~ /admin/ {
        limit_req zone=llmrx_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";          # SSE 长连接
        proxy_buffering off;
        proxy_read_timeout 600s;                # 沿用原有 600s
    }

    # LLM API（核心业务路径；流式必须关缓冲）
    location ^~ /v1/ {
        limit_req zone=llmrx_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 自服务：注册（需邀请码）/ me / 兑换
    location ^~ /api/v1/ {
        limit_req zone=llmrx_selfsvc burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 用户自助页
    location ^~ /account/ {
        limit_req zone=llmrx_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查（监控用；日志不刷屏）
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    # 集群内部端点：公网直接 403（应用层还有内网中间件双保险）
    location ^~ /nodes/ {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        return 403;
    }

    # 兜底：未声明路径 → 记录 + 假 404（真实服务对公网只暴露 5 个前缀）
    location / {
        access_log /var/log/nginx/llmrx-honeypot.log llmrx_honeypot;
        default_type text/html;
        return 404 '<html><head><title>404 Not Found</title></head><body><center><h1>404 Not Found</h1></center><hr><center>Apache</center></body></html>';
    }
}

# ===== *.frp.tokenhub.top → frps(8080) 纯转发（与原文件一致）=====
server {
    listen 443 ssl http2;
    server_name *.frp.tokenhub.top frp.tokenhub.top;
    ssl_certificate     /etc/letsencrypt/live/frp.tokenhub.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frp.tokenhub.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
