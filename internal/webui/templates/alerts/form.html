{{define "alerts_form_body"}}<div class="mb-6">
  <a href="/admin/alerts" class="text-sm text-gray-500 hover:text-gray-700">← 返回列表</a>
  <h1 class="text-2xl font-bold text-gray-900 mt-2">{{.Title}}</h1>
</div>

{{if .FormError}}
<div class="mb-4 p-3 rounded bg-red-100 text-red-800 border border-red-200 text-sm">{{.FormError}}</div>
{{end}}

{{$a := .Alert}}
<form method="POST" action="{{if $a}}/admin/alerts/{{$a.ID}}{{else}}/admin/alerts{{end}}"
      class="bg-white shadow rounded-lg p-6 space-y-6 max-w-lg">
  {{if $a}}<input type="hidden" name="_method" value="PUT">{{end}}
  <div>
    <label class="block text-sm font-medium text-gray-700">名称 *</label>
    <input type="text" name="name" required value="{{if $a}}{{$a.Name}}{{end}}"
           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
  </div>
  <div>
    <label class="block text-sm font-medium text-gray-700">类型 *</label>
    <select name="type" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm bg-white">
      <option value="error_rate" {{if $a}}{{if eq (printf "%s" $a.Type) "error_rate"}}selected{{end}}{{end}}>错误率 (error_rate)</option>
      <option value="p95_latency" {{if $a}}{{if eq (printf "%s" $a.Type) "p95_latency"}}selected{{end}}{{end}}>P95 延迟 (p95_latency)</option>
      <option value="cost_spike" {{if $a}}{{if eq (printf "%s" $a.Type) "cost_spike"}}selected{{end}}{{end}}>成本突增 (cost_spike)</option>
      <option value="key_exhausted" {{if $a}}{{if eq (printf "%s" $a.Type) "key_exhausted"}}selected{{end}}{{end}}>密钥耗尽 (key_exhausted)</option>
    </select>
  </div>
  <div class="grid grid-cols-3 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">阈值 *</label>
      <input type="number" step="any" name="threshold" required value="{{if $a}}{{$a.Threshold}}{{end}}"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">窗口秒</label>
      <input type="number" name="window_sec" value="{{if $a}}{{$a.WindowSec}}{{end}}"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">冷却秒</label>
      <input type="number" name="cooldown_sec" value="{{if $a}}{{$a.CooldownSec}}{{end}}"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
    </div>
  </div>
  <div>
    <label class="block text-sm font-medium text-gray-700">Webhook URL</label>
    <input type="url" name="webhook_url" value="{{if $a}}{{$a.WebhookURL}}{{end}}"
           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
  </div>
  <div>
    <label class="inline-flex items-center">
      <input type="checkbox" name="enabled" value="1" {{if not $a}}checked{{else}}{{if $a.Enabled}}checked{{end}}{{end}}
             class="rounded border-gray-300 text-blue-600">
      <span class="ml-2 text-sm text-gray-700">启用</span>
    </label>
  </div>
  <div class="flex justify-end gap-3 pt-4 border-t">
    <a href="/admin/alerts" class="px-4 py-2 text-gray-700 hover:text-gray-900 text-sm">取消</a>
    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm font-medium">保存</button>
  </div>
</form>
<div id="flash"></div>{{end}}
