{{define "channels_form_body"}}<div class="mb-6">
  <a href="/admin/channels" class="text-sm text-gray-500 hover:text-gray-700">← 返回列表</a>
  <h1 class="text-2xl font-bold text-gray-900 mt-2">
    {{if .Channel}}编辑通道{{else}}新建通道{{end}}
  </h1>
</div>

{{template "partials/form_error.html" .}}

<form method="POST"
      action="{{if .Channel}}/admin/channels/{{.Channel.ID}}{{else}}/admin/channels{{end}}"
      class="bg-white shadow rounded-lg p-6 space-y-6 max-w-3xl">
  {{if .Channel}}<input type="hidden" name="_method" value="PUT">{{end}}

  <div>
    <h2 class="text-lg font-medium text-gray-900 mb-4">基本信息</h2>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">名称 *</label>
        <input type="text" name="name" required value="{{or .FormData.Name .Channel.Name}}"
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Provider *</label>
        <select name="provider" required id="provider-select"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
          {{$p := or .FormData.Provider .Channel.Provider}}
          {{range .Providers}}
          <option value="{{.Name}}" data-base-url="{{.DefaultBaseURL}}" {{if eq $p .Name}}selected{{end}}>{{.DisplayName}}</option>
          {{end}}
        </select>
      </div>
    </div>
  </div>

  <div>
    <h2 class="text-lg font-medium text-gray-900 mb-4">端点配置</h2>
    <div>
      <label class="block text-sm font-medium text-gray-700">Base URL *</label>
      <input type="url" name="base_url" id="base-url-input" required
             value="{{or .FormData.BaseURL .Channel.BaseURL}}"
             placeholder="https://api.openai.com/v1"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
    </div>
  </div>

  <div>
    <h2 class="text-lg font-medium text-gray-900 mb-4">支持的模型</h2>
    <div class="flex items-start gap-3">
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700">模型列表（每行一个）</label>
        <textarea name="models" id="models-textarea" rows="4" required
                  placeholder="gpt-4&#10;gpt-3.5-turbo"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md font-mono text-sm">{{or .FormData.ModelsStr (joinStrings .Channel.Models)}}</textarea>
      </div>
      <div class="pt-7">
        {{if .Channel}}
        <button type="button" id="fetch-models-btn"
                class="px-3 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm font-medium whitespace-nowrap"
                onclick="fetchModels({{.Channel.ID}})">拉取模型</button>
        {{else}}
        <div class="flex flex-col gap-2">
          <button type="button" id="preview-models-btn"
                  class="px-3 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm font-medium whitespace-nowrap"
                  onclick="togglePreviewPanel()">预览拉取</button>
        </div>
        {{end}}
      </div>
    </div>
    <div id="fetch-models-result" class="mt-3"></div>
    {{if not .Channel}}
    <div id="preview-models-panel" class="mt-3 p-3 rounded border border-gray-200 bg-white hidden">
      <div class="flex items-center gap-2 mb-2">
        <label class="text-sm font-medium text-gray-700">API Key</label>
        <input type="password" id="preview-api-key" placeholder="sk-..."
               class="flex-1 px-2 py-1 border border-gray-300 rounded text-sm font-mono">
        <button type="button" class="px-3 py-1 bg-green-600 text-white rounded text-sm" onclick="previewModels()">拉取</button>
      </div>
      <div id="preview-models-result"></div>
    </div>
    {{end}}

    <div id="model-browser" class="mt-4 p-3 rounded border border-gray-200 bg-gray-50">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-gray-700">从模型库选择</span>
        <span id="model-browser-count" class="text-xs text-gray-500">-</span>
      </div>
      <div class="flex gap-2 mb-2">
        <input type="text" id="model-search" placeholder="搜索模型..."
               class="flex-1 px-2 py-1 border border-gray-300 rounded text-sm">
        <button type="button" class="text-xs text-blue-600 px-2 py-1" onclick="selectAllCatalog(true)">全选</button>
        <button type="button" class="text-xs text-gray-500 px-2 py-1" onclick="selectAllCatalog(false)">取消全选</button>
        <button type="button" class="text-xs text-green-600 px-2 py-1 border border-green-200 rounded" onclick="addTopModels(5)">+ 热门 Top 5</button>
      </div>
      <div class="flex flex-wrap gap-2 mb-2 text-xs">
        <label class="flex items-center gap-1 text-gray-600 cursor-pointer">
          <input type="checkbox" id="filter-tool" onchange="renderCatalog()"> 🔧 工具
        </label>
        <label class="flex items-center gap-1 text-gray-600 cursor-pointer">
          <input type="checkbox" id="filter-vision" onchange="renderCatalog()"> 👁️ 图像
        </label>
        <label class="flex items-center gap-1 text-gray-600 cursor-pointer">
          <input type="checkbox" id="filter-reasoning" onchange="renderCatalog()"> 🧠 推理
        </label>
        <label class="flex items-center gap-1 text-gray-600 cursor-pointer">
          <input type="checkbox" id="filter-audio" onchange="renderCatalog()"> 🎙️ 音频
        </label>
        <span class="text-gray-300">|</span>
        <select id="filter-context" onchange="renderCatalog()" class="px-1.5 py-0.5 border border-gray-300 rounded text-xs">
          <option value="0">上下文窗口：不限</option>
          <option value="16000">≥ 16K</option>
          <option value="32000">≥ 32K</option>
          <option value="128000">≥ 128K</option>
          <option value="200000">≥ 200K</option>
          <option value="1000000">≥ 1M</option>
        </select>
      </div>
      <div id="model-catalog-list" class="max-h-64 overflow-y-auto space-y-1">
        <p class="text-sm text-gray-400 py-4 text-center">选择 provider 后加载模型列表</p>
      </div>
      <div class="flex items-center justify-between mt-2">
        <button type="button" class="px-3 py-1 bg-blue-600 text-white rounded text-sm" onclick="addCatalogModels()">添加选中模型 →</button>
        <span id="price-hint" class="text-xs text-gray-400"></span>
      </div>
    </div>
    <div class="mt-3">
      <label class="block text-sm font-medium text-gray-700">意图标签（可选，每行一个）</label>
      <textarea name="intents" rows="3"
                placeholder="code&#10;summary&#10;translate"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md font-mono text-sm">{{or .FormData.IntentsStr (joinStrings .Channel.Intents)}}</textarea>
    </div>
  </div>

  <div>
    <h2 class="text-lg font-medium text-gray-900 mb-4">路由参数</h2>
    <div class="grid grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">优先级</label>
        <input type="number" name="priority" value="{{or .FormData.PriorityStr (printf "%d" .Channel.Priority)}}"
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">输入价格 ($/1M)</label>
        <input type="number" step="0.0001" name="input_price" value="{{or .FormData.InputPriceStr (printf "%.4f" .Channel.InputPrice)}}"
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">输出价格 ($/1M)</label>
        <input type="number" step="0.0001" name="output_price" value="{{or .FormData.OutputPriceStr (printf "%.4f" .Channel.OutputPrice)}}"
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
      </div>
    </div>
  </div>

  <div>
    <label class="flex items-center">
      <input type="checkbox" name="status" value="1"
             {{if or (eq .FormData.Status "1") (eq .Channel.Status 1) (and (not .FormData) (not .Channel))}}checked{{end}}
             class="rounded border-gray-300">
      <span class="ml-2 text-sm text-gray-700">启用</span>
    </label>
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t">
    <a href="/admin/channels" class="px-4 py-2 text-gray-700 hover:text-gray-900 text-sm">取消</a>
    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm font-medium">
      {{if .Channel}}保存{{else}}创建{{end}}
    </button>
  </div>
</form>
<div id="flash"></div>

<script>
// Auto-fill base_url when provider changes (only if the field is
// empty or matches a known provider default).
document.getElementById('provider-select').addEventListener('change', function() {
  var selected = this.options[this.selectedIndex];
  var defaultURL = selected.getAttribute('data-base-url');
  var urlInput = document.getElementById('base-url-input');
  if (defaultURL && (!urlInput.value || urlInput.dataset.autoFilled === 'true')) {
    urlInput.value = defaultURL;
    urlInput.dataset.autoFilled = 'true';
  }
});

// Fetch models from upstream and show a preview/select dialog.
function fetchModels(channelId) {
  var btn = document.getElementById('fetch-models-btn');
  var result = document.getElementById('fetch-models-result');
  btn.disabled = true;
  btn.textContent = '拉取中...';
  result.innerHTML = '';

  fetch('/admin/channels/' + channelId + '/fetch-models', {method: 'POST'})
    .then(function(resp) {
      if (!resp.ok) {
        return resp.text().then(function(t) { throw new Error(t) });
      }
      return resp.json();
    })
    .then(function(data) {
      var models = data.models || [];
      if (models.length === 0) {
        result.innerHTML = '<p class="text-sm text-gray-500">上游未返回任何模型</p>';
        return;
      }
      var ta = document.getElementById('models-textarea');
      var existing = ta.value.split('\n').map(function(s) { return s.trim() }).filter(function(s) { return s });
      var html = '<div class="p-3 rounded border border-gray-200 bg-gray-50">';
      html += '<div class="flex items-center justify-between mb-2">';
      html += '<span class="text-sm font-medium text-gray-700">发现 ' + models.length + ' 个模型，勾选后追加</span>';
      html += '<div class="flex gap-2">';
      html += '<button type="button" class="text-xs text-blue-600" onclick="selectAllModels(true)">全选</button>';
      html += '<button type="button" class="text-xs text-gray-500" onclick="selectAllModels(false)">取消全选</button>';
      html += '</div></div>';
      html += '<div class="max-h-48 overflow-y-auto space-y-1">';
      models.forEach(function(m) {
        var checked = existing.indexOf(m) >= 0;
        html += '<label class="flex items-center text-sm"><input type="checkbox" value="' + escapeHtml(m) + '" class="mr-2 model-checkbox"' + (checked ? ' checked' : '') + '>' + escapeHtml(m) + '</label>';
      });
      html += '</div>';
      html += '<button type="button" class="mt-2 px-3 py-1 bg-blue-600 text-white rounded text-sm" onclick="applyFetchedModels()">追加到列表</button>';
      html += '</div>';
      result.innerHTML = html;
    })
    .catch(function(err) {
      result.innerHTML = '<p class="text-sm text-red-600">拉取失败: ' + escapeHtml(err.message) + '</p>';
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '拉取模型';
    });
}

function selectAllModels(checked) {
  document.querySelectorAll('.model-checkbox').forEach(function(cb) { cb.checked = checked });
}

function applyFetchedModels() {
  var ta = document.getElementById('models-textarea');
  var existing = ta.value.split('\n').map(function(s) { return s.trim() }).filter(function(s) { return s });
  document.querySelectorAll('.model-checkbox:checked').forEach(function(cb) {
    if (existing.indexOf(cb.value) < 0) {
      existing.push(cb.value);
    }
  });
  ta.value = existing.join('\n');
  document.getElementById('fetch-models-result').innerHTML = '';
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

var catalogModels = [];
var catalogFiltered = [];

function loadCatalogModels(provider) {
  var listEl = document.getElementById('model-catalog-list');
  var countEl = document.getElementById('model-browser-count');
  listEl.innerHTML = '<p class="text-sm text-gray-400 py-4 text-center">加载中...</p>';
  countEl.textContent = '-';

  fetch('/admin/api/models-by-provider?provider=' + encodeURIComponent(provider))
    .then(function(resp) { return resp.json(); })
    .then(function(data) {
      catalogModels = data.models || [];
      document.getElementById('model-search').value = '';
      renderCatalog();
    })
    .catch(function() {
      listEl.innerHTML = '<p class="text-sm text-red-500 py-4 text-center">加载失败</p>';
      countEl.textContent = '-';
    });
}

function renderCatalog() {
  var q = document.getElementById('model-search').value.toLowerCase().trim();
  var listEl = document.getElementById('model-catalog-list');
  var countEl = document.getElementById('model-browser-count');

  catalogFiltered = catalogModels.filter(function(m) {
    if (q && m.id.toLowerCase().indexOf(q) < 0 && (!m.name || m.name.toLowerCase().indexOf(q) < 0)) {
      return false;
    }
    var ft = document.getElementById('filter-tool');
    if (ft && ft.checked && !(m.capabilities && m.capabilities.tool_call)) return false;
    var fv = document.getElementById('filter-vision');
    if (fv && fv.checked && !(m.capabilities && m.capabilities.attachment)) return false;
    var fr = document.getElementById('filter-reasoning');
    if (fr && fr.checked && !(m.capabilities && m.capabilities.reasoning)) return false;
    var fa = document.getElementById('filter-audio');
    if (fa && fa.checked && !(m.modalities && m.modalities.indexOf('audio') >= 0)) return false;
    var fc = document.getElementById('filter-context');
    if (fc && fc.value && parseInt(fc.value) > 0 && (m.context_window || 0) < parseInt(fc.value)) return false;
    return true;
  });

  if (catalogModels.length === 0) {
    listEl.innerHTML = '<p class="text-sm text-gray-400 py-4 text-center">该 provider 暂无已知模型，可手动输入</p>';
    countEl.textContent = '0 / 0';
    return;
  }

  var ta = document.getElementById('models-textarea');
  var existing = ta.value.split('\n').map(function(s) { return s.trim() }).filter(function(s) { return s });

  var html = '';
  catalogFiltered.forEach(function(m) {
    var checked = existing.indexOf(m.id) >= 0;
    var badges = [];
    if (m.context_window) {
      var cw = m.context_window;
      if (cw >= 1000) { cw = (cw / 1000) + 'K'; } else { cw = cw + ''; }
      badges.push('<span class="text-xs text-gray-500">' + cw + '</span>');
    }
    if (m.capabilities && m.capabilities.tool_call) badges.push('<span title="工具调用">🔧</span>');
    if (m.capabilities && m.capabilities.attachment) badges.push('<span title="图像">👁️</span>');
    if (m.capabilities && m.capabilities.reasoning) badges.push('<span title="推理">🧠</span>');
    var hasAudio = m.modalities && m.modalities.indexOf('audio') >= 0;
    if (hasAudio) badges.push('<span title="音频">🎙️</span>');

    html += '<label class="flex items-start gap-2 p-1.5 rounded hover:bg-white cursor-pointer text-sm">';
    html += '<input type="checkbox" value="' + escapeHtml(m.id) + '" class="mt-0.5 catalog-checkbox"' + (checked ? ' checked' : '') + ' data-price-in="' + (m.input_price || 0) + '" data-price-out="' + (m.output_price || 0) + '">';
    html += '<div class="flex-1 min-w-0">';
    html += '<div class="flex items-center gap-2">';
    html += '<span class="font-mono text-gray-900">' + escapeHtml(m.id) + '</span>';
    html += '<span class="flex items-center gap-1 flex-shrink-0">' + badges.join('') + '</span>';
    html += '</div>';
    if (m.name && m.name !== m.id) {
      html += '<div class="text-xs text-gray-500">' + escapeHtml(m.name) + '</div>';
    }
    html += '</div></label>';
  });

  listEl.innerHTML = html;
  updateCatalogCount();
}

function updateCatalogCount() {
  var countEl = document.getElementById('model-browser-count');
  var selected = document.querySelectorAll('.catalog-checkbox:checked').length;
  countEl.textContent = '已选 ' + selected + ' / 共 ' + catalogFiltered.length;
}

function selectAllCatalog(checked) {
  document.querySelectorAll('.catalog-checkbox').forEach(function(cb) { cb.checked = checked });
  updateCatalogCount();
}

function addTopModels(n) {
  var ta = document.getElementById('models-textarea');
  var existing = ta.value.split('\n').map(function(s) { return s.trim() }).filter(function(s) { return s });
  var added = 0;
  var firstPrice = null;
  for (var i = 0; i < catalogModels.length && added < n; i++) {
    var m = catalogModels[i];
    if (existing.indexOf(m.id) < 0) {
      existing.push(m.id);
      added++;
      if (!firstPrice) {
        firstPrice = { in: m.input_price || 0, out: m.output_price || 0 };
      }
    }
  }
  ta.value = existing.join('\n');

  var hintEl = document.getElementById('price-hint');
  if (firstPrice && added > 0) {
    hintEl.textContent = '参考价：输入 $' + firstPrice.in.toFixed(4) + ' / 输出 $' + firstPrice.out.toFixed(4) + '（基于 ' + catalogModels[0].id + '，仅供参考）';
  }

  renderCatalog();
}

function addCatalogModels() {
  var ta = document.getElementById('models-textarea');
  var existing = ta.value.split('\n').map(function(s) { return s.trim() }).filter(function(s) { return s });
  var added = [];
  var firstPrice = null;

  document.querySelectorAll('.catalog-checkbox:checked').forEach(function(cb) {
    if (existing.indexOf(cb.value) < 0) {
      existing.push(cb.value);
      added.push(cb.value);
      if (!firstPrice) {
        firstPrice = { in: parseFloat(cb.getAttribute('data-price-in')), out: parseFloat(cb.getAttribute('data-price-out')) };
      }
    }
  });

  ta.value = existing.join('\n');

  var hintEl = document.getElementById('price-hint');
  if (firstPrice && added.length > 0) {
    hintEl.textContent = '参考价：输入 $' + firstPrice.in.toFixed(4) + ' / 输出 $' + firstPrice.out.toFixed(4) + '（基于 ' + added[0] + '，仅供参考）';
  } else {
    hintEl.textContent = '';
  }

  renderCatalog();
}

document.addEventListener('change', function(e) {
  if (e.target.classList && e.target.classList.contains('catalog-checkbox')) {
    updateCatalogCount();
  }
});

document.getElementById('model-search').addEventListener('input', function() {
  renderCatalog();
});

document.getElementById('provider-select').addEventListener('change', function() {
  loadCatalogModels(this.value);
});

(function() {
  var sel = document.getElementById('provider-select');
  var urlInput = document.getElementById('base-url-input');
  if (sel && sel.value && !urlInput.value) {
    var selected = sel.options[sel.selectedIndex];
    var defaultURL = selected.getAttribute('data-base-url');
    if (defaultURL) {
      urlInput.value = defaultURL;
      urlInput.dataset.autoFilled = 'true';
    }
  }
  if (sel && sel.value) {
    loadCatalogModels(sel.value);
  }
})();

function togglePreviewPanel() {
  var panel = document.getElementById('preview-models-panel');
  if (panel) panel.classList.toggle('hidden');
}

function previewModels() {
  var provider = document.getElementById('provider-select').value;
  var baseURL = document.getElementById('base-url-input').value;
  var apiKey = document.getElementById('preview-api-key').value;
  var resultEl = document.getElementById('preview-models-result');

  if (!provider || !baseURL) {
    resultEl.innerHTML = '<p class="text-sm text-red-600">请先填写 provider 和 base_url</p>';
    return;
  }

  resultEl.innerHTML = '<p class="text-sm text-gray-400">拉取中...</p>';

  var form = new FormData();
  form.append('provider', provider);
  form.append('base_url', baseURL);
  form.append('api_key', apiKey);

  fetch('/admin/api/preview-models', {method: 'POST', body: form})
    .then(function(resp) {
      if (!resp.ok) return resp.text().then(function(t) { throw new Error(t) });
      return resp.json();
    })
    .then(function(data) {
      var models = data.models || [];
      if (models.length === 0) {
        resultEl.innerHTML = '<p class="text-sm text-gray-500">上游未返回任何模型</p>';
        return;
      }
      var ta = document.getElementById('models-textarea');
      var existing = ta.value.split('\n').map(function(s) { return s.trim() }).filter(function(s) { return s });
      var html = '<div class="border border-gray-200 rounded">';
      html += '<div class="flex items-center justify-between px-2 py-1 bg-gray-50 border-b">';
      html += '<span class="text-xs text-gray-600">发现 ' + models.length + ' 个模型</span>';
      html += '<div class="flex gap-2">';
      html += '<button type="button" class="text-xs text-blue-600" onclick="selectAllPreview(true)">全选</button>';
      html += '<button type="button" class="text-xs text-gray-500" onclick="selectAllPreview(false)">取消全选</button>';
      html += '</div></div>';
      html += '<div class="max-h-48 overflow-y-auto space-y-1 p-2">';
      models.forEach(function(m) {
        var checked = existing.indexOf(m) >= 0;
        html += '<label class="flex items-center text-sm"><input type="checkbox" value="' + escapeHtml(m) + '" class="mr-2 preview-checkbox"' + (checked ? ' checked' : '') + '>' + escapeHtml(m) + '</label>';
      });
      html += '</div>';
      html += '<div class="px-2 py-1 border-t bg-gray-50">';
      html += '<button type="button" class="px-3 py-1 bg-blue-600 text-white rounded text-xs" onclick="applyPreviewModels()">追加到列表</button>';
      html += '</div></div>';
      resultEl.innerHTML = html;
    })
    .catch(function(err) {
      resultEl.innerHTML = '<p class="text-sm text-red-600">拉取失败: ' + escapeHtml(err.message) + '</p>';
    });
}

function selectAllPreview(checked) {
  document.querySelectorAll('.preview-checkbox').forEach(function(cb) { cb.checked = checked });
}

function applyPreviewModels() {
  var ta = document.getElementById('models-textarea');
  var existing = ta.value.split('\n').map(function(s) { return s.trim() }).filter(function(s) { return s });
  document.querySelectorAll('.preview-checkbox:checked').forEach(function(cb) {
    if (existing.indexOf(cb.value) < 0) {
      existing.push(cb.value);
    }
  });
  ta.value = existing.join('\n');
  document.getElementById('preview-models-result').innerHTML = '';
  renderCatalog();
}
</script>{{end}}
