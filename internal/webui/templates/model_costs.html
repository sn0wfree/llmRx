{{define "model_costs_body"}}<div>
  <div class="mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">模型价格</h1>
      <p class="mt-1 text-sm text-gray-500">计费费率表（每 1M token，image 按张）。此表是唯一计费来源；未定价模型会被拒绝调用（422）。</p>
    </div>
    <div class="flex gap-2">
      {{if .Missing}}
      <button onclick="importModelCosts()" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm font-medium">
        从目录导入 {{len .Missing}} 个模型
      </button>
      {{end}}
      <button onclick="toggleAddForm()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm font-medium">新增</button>
    </div>
  </div>

  <div id="add-form" class="hidden bg-white shadow rounded-lg p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">新增模型价格</h2>
    <form id="create-form" class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <input id="nc-model" placeholder="模型 ID" required class="px-3 py-2 border border-gray-300 rounded-md text-sm">
      <input id="nc-input" type="number" step="0.0001" value="0" placeholder="输入 $/1M" class="px-3 py-2 border border-gray-300 rounded-md text-sm">
      <input id="nc-output" type="number" step="0.0001" value="0" placeholder="输出 $/1M" class="px-3 py-2 border border-gray-300 rounded-md text-sm">
      <input id="nc-cache-read" type="number" step="0.0001" value="0" placeholder="缓存读 $/1M" class="px-3 py-2 border border-gray-300 rounded-md text-sm">
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium">保存</button>
    </form>
  </div>

  <div id="msg" class="mb-4"></div>

  <div class="bg-white shadow rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">模型</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">输入 $/1M</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">输出 $/1M</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">缓存读 $/1M</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">缓存写 $/1M</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">推理 $/1M</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">图片 $/张</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">&gt;128k 入/出</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">&gt;200k 入/出</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">上下文</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        {{range .Costs}}
        <tr>
          <form onsubmit="updateModelCost(event, '{{.Model}}')" class="contents">
            <td class="px-4 py-3 whitespace-nowrap text-sm font-mono text-gray-900">{{.Model}}</td>
            <td class="px-4 py-3"><input name="input_price_per_1m" type="number" step="0.0001" value="{{printf "%.4f" .InputPricePer1M}}" class="w-24 px-2 py-1 border border-gray-200 rounded text-sm text-right"></td>
            <td class="px-4 py-3"><input name="output_price_per_1m" type="number" step="0.0001" value="{{printf "%.4f" .OutputPricePer1M}}" class="w-24 px-2 py-1 border border-gray-200 rounded text-sm text-right"></td>
            <td class="px-4 py-3"><input name="cache_read_price_per_1m" type="number" step="0.0001" value="{{printf "%.4f" .CacheReadPricePer1M}}" class="w-24 px-2 py-1 border border-gray-200 rounded text-sm text-right"></td>
            <td class="px-4 py-3"><input name="cache_write_price_per_1m" type="number" step="0.0001" value="{{printf "%.4f" .CacheWritePricePer1M}}" class="w-24 px-2 py-1 border border-gray-200 rounded text-sm text-right"></td>
            <td class="px-4 py-3"><input name="reasoning_price_per_1m" type="number" step="0.0001" value="{{printf "%.4f" .ReasoningPricePer1M}}" class="w-24 px-2 py-1 border border-gray-200 rounded text-sm text-right"></td>
            <td class="px-4 py-3"><input name="image_price" type="number" step="0.0001" value="{{printf "%.4f" .ImagePrice}}" class="w-20 px-2 py-1 border border-gray-200 rounded text-sm text-right"></td>
            <td class="px-4 py-3">
              <input name="input_price_per_1m_above_128k" type="number" step="0.0001" value="{{printf "%.4f" .InputPricePer1MAbove128K}}" class="w-20 px-2 py-1 border border-gray-200 rounded text-sm text-right">
              <input name="output_price_per_1m_above_128k" type="number" step="0.0001" value="{{printf "%.4f" .OutputPricePer1MAbove128K}}" class="w-20 px-2 py-1 border border-gray-200 rounded text-sm text-right mt-1">
            </td>
            <td class="px-4 py-3">
              <input name="input_price_per_1m_above_200k" type="number" step="0.0001" value="{{printf "%.4f" .InputPricePer1MAbove200K}}" class="w-20 px-2 py-1 border border-gray-200 rounded text-sm text-right">
              <input name="output_price_per_1m_above_200k" type="number" step="0.0001" value="{{printf "%.4f" .OutputPricePer1MAbove200K}}" class="w-20 px-2 py-1 border border-gray-200 rounded text-sm text-right mt-1">
            </td>
            <td class="px-4 py-3 text-sm text-gray-600 text-right">{{.ContextWindow}}</td>
            <td class="px-4 py-3 whitespace-nowrap text-right">
              <button type="submit" class="text-xs text-blue-600 hover:text-blue-800">保存</button>
              <button type="button" onclick="deleteModelCost(event, '{{.Model}}')" class="ml-2 text-xs text-red-600 hover:text-red-800">删除</button>
            </td>
          </form>
        </tr>
        {{else}}
        <tr><td colspan="11" class="px-6 py-8 text-center text-sm text-gray-400">费率表为空 — 从目录导入或新增</td></tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
<script>
function msg(html){ const b=document.getElementById('msg'); b.innerHTML='<div class="p-3 rounded text-sm '+html+'"></div>'; setTimeout(()=>b.innerHTML='',3000); }
function toggleAddForm(){ document.getElementById('add-form').classList.toggle('hidden'); }
async function importModelCosts(){
  const r = await fetch('/admin/model-costs/import', {method:'POST'});
  if (r.ok) msg('bg-green-100 text-green-800 border border-green-200">导入成功'); else msg('bg-red-100 text-red-800 border border-red-200">导入失败');
  setTimeout(()=>location.reload(), 800);
}
async function updateModelCost(e, model){
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const body = {};
  fd.forEach((v,k)=>{ body[k] = parseFloat(v) || 0; });
  const r = await fetch('/admin/model-costs/'+encodeURIComponent(model), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (r.ok) msg('bg-green-100 text-green-800 border border-green-200">已保存'); else msg('bg-red-100 text-red-800 border border-red-200">保存失败');
}
async function deleteModelCost(e, model){
  e.preventDefault();
  if(!confirm('删除 '+model+' 的价格？该模型将无法被调用。')) return;
  const r = await fetch('/admin/model-costs/'+encodeURIComponent(model)+'/delete', {method:'POST'});
  if (r.ok) location.reload(); else msg('bg-red-100 text-red-800 border border-red-200">删除失败');
}
document.getElementById('create-form')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    model: document.getElementById('nc-model').value.trim(),
    input_price_per_1m: parseFloat(document.getElementById('nc-input').value)||0,
    output_price_per_1m: parseFloat(document.getElementById('nc-output').value)||0,
    cache_read_price_per_1m: parseFloat(document.getElementById('nc-cache-read').value)||0,
  };
  const r = await fetch('/admin/model-costs', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (r.ok) location.reload(); else msg('bg-red-100 text-red-800 border border-red-200">新增失败');
});
</script>
{{end}}
