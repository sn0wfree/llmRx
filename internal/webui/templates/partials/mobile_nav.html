{{define "partials/mobile_topbar.html"}}<header class="md:hidden flex items-center justify-between px-4 h-12 bg-white border-b border-gray-200 flex-none">
  <div class="flex items-baseline gap-2 min-w-0">
    <h1 class="text-base font-bold text-gray-900">llmRx</h1>
    <span class="text-xs text-gray-500">用户中心</span>
  </div>
  <div class="flex items-center">
    <a href="/admin/users/{{.User.ID}}/password" class="p-2 text-gray-500 hover:text-gray-700" aria-label="修改密码">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
    </a>
    <form method="POST" action="/admin/logout">
      <button type="submit" class="p-2 text-gray-500 hover:text-red-600" aria-label="登出">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </form>
  </div>
</header>{{end}}

{{define "partials/mobile_tabbar.html"}}<nav class="md:hidden flex-none px-4 pt-1 pb-[max(0.625rem,env(safe-area-inset-bottom))] bg-gray-100" aria-label="页面导航">
  <div class="flex gap-1 w-max mx-auto bg-white border border-gray-200 rounded-full p-1 shadow-lg shadow-gray-900/5">
    <a href="/account" class="flex items-center gap-1.5 h-9 px-4 rounded-full text-xs {{if eq .Active "me"}}bg-blue-600 text-white font-medium{{else}}text-gray-500 hover:text-gray-700{{end}}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      首页
    </a>
    <a href="/account/usage" class="flex items-center gap-1.5 h-9 px-4 rounded-full text-xs {{if eq .Active "me-usage"}}bg-blue-600 text-white font-medium{{else}}text-gray-500 hover:text-gray-700{{end}}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      用量
    </a>
    <a href="/account/topup" class="flex items-center gap-1.5 h-9 px-4 rounded-full text-xs {{if eq .Active "me-topup"}}bg-blue-600 text-white font-medium{{else}}text-gray-500 hover:text-gray-700{{end}}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      充值
    </a>
  </div>
</nav>{{end}}
