{{define "me_topup_body"}}<div class="max-w-2xl mx-auto">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">充值</h1>
    <p class="mt-1 text-sm text-gray-500">使用充值码增加账户预算</p>
  </div>

  <div class="bg-white shadow rounded-lg p-6 mb-4">
    <div class="text-center mb-4">
      <div class="text-xs text-gray-400 uppercase">当前余额</div>
      <div class="text-3xl font-bold text-gray-900 mt-1">${{printf "%.2f" .Me.BudgetUSD}}</div>
      <div class="text-xs text-gray-400 mt-1">已用 ${{printf "%.4f" .Me.UsedUSD}} · 剩余 ${{printf "%.2f" .Me.RemainingUSD}}</div>
    </div>
  </div>

  <div class="bg-white shadow rounded-lg p-6 mb-4">
    <h2 class="text-sm font-semibold text-gray-500 uppercase mb-3">输入充值码</h2>
    <p class="text-sm text-gray-500 mb-4">充值码请向管理员购买，格式为 <code class="bg-gray-100 px-1 rounded">RXM-XXXXXXXX</code></p>
    <form id="redeem-form" class="flex gap-2">
      <input type="text" id="redeem-code" required placeholder="RXM-XXXXXXXX"
             class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 font-mono">
      <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm font-medium whitespace-nowrap">兑换</button>
    </form>
    <div id="redeem-result" class="mt-3"></div>
  </div>

  <a href="/account" class="inline-block px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 text-sm font-medium">← 返回首页</a>
</div>
<script>
document.getElementById('redeem-form')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('redeem-result');
  const btn = e.target.querySelector('button[type="submit"]');
  box.innerHTML = '';
  btn.disabled = true; btn.textContent = '兑换中...';
  try {
    const resp = await fetch('/api/v1/me/redeem', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code: document.getElementById('redeem-code').value}),
    });
    const data = await resp.json();
    if (resp.ok) {
      box.innerHTML = '<div class="p-3 rounded bg-green-100 text-green-800 border border-green-200 text-sm">兑换成功! 新预算 $' +
        Number(data.budget_usd).toFixed(2) + '</div>';
      setTimeout(() => window.location.reload(), 1000);
    } else {
      box.innerHTML = '<div class="p-3 rounded bg-red-100 text-red-800 border border-red-200 text-sm">' +
        (data.error?.message || '兑换失败，请检查充值码') + '</div>';
    }
  } catch (err) {
    box.innerHTML = '<div class="p-3 rounded bg-red-100 text-red-800 border border-red-200 text-sm">网络错误，请重试</div>';
  }
  btn.disabled = false; btn.textContent = '兑换';
});
</script>
{{end}}
